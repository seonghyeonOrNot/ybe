<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>휴가 대상자 관리 · y-BE</title>
<link rel="stylesheet" href="../shared/components.css" />
</head>
<body>

<div class="gnb">
  <div class="gnb-left">
    <span class="logo">Y-BE</span>
    <span class="company">와이비이 주식회사</span>
  </div>
  <div class="gnb-right">
    <span>관리자 · 김성현</span>
    <span class="company">로그아웃</span>
  </div>
</div>

<div class="app-shell">
  <nav class="lnb">
    <div class="menu-item on">근태/휴가 관리</div>
    <div class="sub-item active">휴가 대상자 관리</div>
    <div class="sub-item">연차/휴가 사용 내역</div>
    <div class="sub-item">근태 현황</div>
    <div class="menu-item">조직·구성원 관리</div>
    <div class="menu-item">전자계약 현황</div>
    <div class="menu-item">연차 설정</div>
    <div class="menu-item">게시판 관리</div>
  </nav>

  <main class="content-area">
    <div class="page-head">
      <h1 class="page-title">휴가 대상자 관리</h1>
    </div>

    <div class="filter-row">
      <div class="filter-field">
        <span class="filter-label">휴가 연도</span>
        <select id="fYear"><option>2026</option><option>2025</option></select>
      </div>
      <div class="filter-field">
        <span class="filter-label">휴가 형태</span>
        <select id="fType"><option>전체</option><option>대상 휴가</option><option>비대상 휴가</option></select>
      </div>
      <div class="filter-field">
        <span class="filter-label">부여 방식</span>
        <select id="fGrant"><option>전체</option><option>일반</option><option>반복</option></select>
      </div>
      <div class="filter-field locked">
        <span class="filter-label">상태</span>
        <select id="fStatus"><option>전체</option><option>예정</option><option>사용 중</option><option>종료</option><option>만료</option><option>소멸 임박</option></select>
      </div>
      <input class="input-pill" id="fQ" placeholder="이름/직책/부서명 검색" style="width:220px" />
      <button class="btn point" id="btnSearch">검색</button>
      <button class="btn outline point" id="btnReset">초기화</button>
      <div class="row-end">
        <button class="btn outline positive" id="btnExcel">엑셀 다운로드</button>
        <button class="btn point3" id="btnRegister">휴가 대상자 등록</button>
      </div>
    </div>

    <div class="stat-grid" id="statGrid"></div>

    <div class="layout-2col">
      <aside class="tree-panel">
        <div class="panel-title">조직도</div>
        <input class="input-pill" id="treeQ" placeholder="이름/직책/부서명" style="width:100%; margin-bottom:12px;" />
        <div class="tree-all" id="treeAll"></div>
        <div id="treeBody"></div>
      </aside>

      <section class="table-panel">
        <div class="list-head">
          <div class="result" id="resultLabel"></div>
          <div id="bulkArea"></div>
        </div>

        <div class="table-wrap scroll">
          <table class="ybe-table">
            <thead>
              <tr>
                <th style="width:40px"><span class="chk invert" id="chkAll"></span></th>
                <th class="sortable" data-sort="no">no <span id="arrowNo"></span></th>
                <th>대상자</th>
                <th>휴가 형태(상세)</th>
                <th>상태</th>
                <th>유효 기간</th>
                <th>사용 현황</th>
                <th>부여 방식</th>
                <th class="sortable" data-sort="date">최신 등록일 <span id="arrowDate"></span></th>
                <th>이력</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div id="emptyState"></div>
        </div>

        <div class="pagination" id="pagination"></div>
      </section>
    </div>
  </main>
</div>

<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div id="confirmRoot"></div>
<div id="toastRoot"></div>

<script>
/* ---------------------------------------------------------------------------
   ADM-LEV 휴가 대상자 관리
   - 상태 판정: 잔여 0 = 종료 / 잔여 남은 채 유효기간 경과 = 만료
   - 사용 조건은 목록 열이 아니라 휴가 형태 옆 (!) 아이콘 툴팁으로 노출
   - 통계 카드는 전체 기준 값이며 클릭 시 상태 필터로 진입
   - 기준일자는 프로토타입 확인용 고정값. 운영 반영 시 new Date()로 교체.
--------------------------------------------------------------------------- */
var TODAY = new Date("2026-08-23");
var PER_PAGE = 20;

function d(s) { return new Date(s); }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

var SEED = [
  { no:41, date:"2026-08-22", dept:"운영팀/본사", name:"고유리 사원B/부팀장B", kind:"대상 휴가", type:"리프레시 휴가_40시간", grant:"일반", grantNote:"", start:"2026-09-01", end:"2026-12-31", periodNote:"(총 18주)", cond:"-", usedH:0, totalH:40, unit:"시간",
    usage:[], history:[{date:"2026-08-22", change:"신규 등록", who:"김성현"}] },
  { no:40, date:"2026-08-18", dept:"실험부서", name:"박지훈 사원C/파트장", kind:"대상 휴가", type:"보상 휴가_16시간", grant:"일반", grantNote:"", start:"2026-08-01", end:"2026-09-30", periodNote:"(총 9주)", cond:"-", usedH:6, totalH:16, unit:"시간",
    usage:[{date:"2026-08-07", note:"종일 사용", amount:"4시간"},{date:"2026-08-18", note:"반차 사용", amount:"2시간"}], history:[{date:"2026-08-01", change:"신규 등록", who:"김성현"}] },
  { no:39, date:"2026-08-15", dept:"실험부서", name:"정하늘 사원A/사원", kind:"대상 휴가", type:"경조 휴가_결혼", grant:"일반", grantNote:"", start:"2026-08-10", end:"2026-08-31", periodNote:"(총 4주)", cond:"-", usedH:40, totalH:40, unit:"시간",
    usage:[{date:"2026-08-17", note:"종일 사용", amount:"24시간"},{date:"2026-08-20", note:"종일 사용", amount:"16시간"}], history:[{date:"2026-08-15", change:"신규 등록", who:"김성현"},{date:"2026-08-20", change:"잔여 0시간 도달", who:"시스템"}] },
  { no:38, date:"2026-08-12", dept:"운영팀/본사", name:"서수연 사원D/직책크", kind:"대상 휴가", type:"리프레시 휴가_8시간", grant:"일반", grantNote:"", start:"2026-08-01", end:"2026-09-05", periodNote:"(총 6주)", cond:"-", usedH:2, totalH:8, unit:"시간",
    usage:[{date:"2026-08-14", note:"반차 사용", amount:"2시간"}], history:[{date:"2026-08-12", change:"부여 총량 5시간 → 8시간", who:"김성현"}] },
  { no:33, date:"2026-06-20", dept:"신설부서", name:"최민서 사원A/사원", kind:"대상 휴가", type:"경조 휴가_민방위", grant:"일반", grantNote:"", start:"2026-06-15", end:"2026-07-15", periodNote:"(총 5주)", cond:"-", usedH:0, totalH:8, unit:"시간",
    usage:[], history:[{date:"2026-06-20", change:"신규 등록", who:"김성현"},{date:"2026-07-16", change:"미사용 만료", who:"시스템"}] },
  { no:30, date:"2026-05-04", dept:"운영팀/본사", name:"이광호 사원B/팀장B", kind:"대상 휴가", type:"보상 휴가_24시간", grant:"일반", grantNote:"", start:"2026-04-01", end:"2026-06-30", periodNote:"(총 14주)", cond:"-", usedH:24, totalH:24, unit:"시간",
    usage:[{date:"2026-05-08", note:"종일 사용", amount:"16시간"},{date:"2026-06-19", note:"종일 사용", amount:"8시간"}], history:[{date:"2026-05-04", change:"신규 등록", who:"김성현"},{date:"2026-07-01", change:"유효 기간 종료 처리", who:"시스템"}] },
  { no:29, date:"2026-08-10", dept:"신설부서", name:"9_test_3 사원_", kind:"대상 휴가", type:"아호데이", grant:"반복", grantNote:"매주 · 일요일 기준 8시간", start:"2026-08-01", end:"2026-12-31", periodNote:"(총 22회)", cond:"제한 없음", usedH:3, totalH:22, unit:"회",
    usage:[{date:"2026-08-09", note:"반복 회차 사용", amount:"1회"},{date:"2026-08-16", note:"반복 회차 사용", amount:"2회"}], history:[{date:"2026-08-10", change:"신규 등록", who:"김성현"}] },
  { no:28, date:"2026-07-28", dept:"운영팀/본사", name:"이광호 사원B/팀장B", kind:"대상 휴가", type:"아호데이", grant:"반복", grantNote:"매주 · 월요일 기준 8시간", start:"2026-01-31", end:"2026-12-31", periodNote:"(총 48회)", cond:"공휴일 포함 주 사용 불가", usedH:12, totalH:48, unit:"회",
    usage:[{date:"2026-07-06", note:"반복 회차 사용", amount:"1회"},{date:"2026-08-03", note:"반복 회차 사용", amount:"1회"}], history:[{date:"2026-07-28", change:"기준 요일 일요일 → 월요일", who:"김성현"}] },
  { no:25, date:"2026-07-02", dept:"실험부서", name:"박지훈 사원C/파트장", kind:"대상 휴가", type:"아호데이", grant:"반복", grantNote:"매주 · 금요일 기준 4시간", start:"2026-03-01", end:"2026-09-10", periodNote:"(총 27회)", cond:"공휴일 포함 주 사용 불가", usedH:20, totalH:27, unit:"회",
    usage:[{date:"2026-07-17", note:"반복 회차 사용", amount:"1회"},{date:"2026-08-14", note:"반차 사용", amount:"0.5회"}], history:[{date:"2026-07-02", change:"사용 조건 변경", who:"김성현"}] },
  { no:22, date:"2026-06-30", dept:"실험부서", name:"정하늘 사원A/사원", kind:"대상 휴가", type:"리프레시 휴가_월1회", grant:"반복", grantNote:"매월 · 1일 기준 8시간", start:"2026-10-01", end:"2027-03-31", periodNote:"(총 6회)", cond:"제한 없음", usedH:0, totalH:6, unit:"회",
    usage:[], history:[{date:"2026-06-30", change:"신규 등록", who:"김성현"}] },
  { no:19, date:"2026-05-20", dept:"운영팀/본사", name:"이광호 사원B/팀장B", kind:"대상 휴가", type:"아호데이(1차)", grant:"반복", grantNote:"매월 · 말일 기준 8시간", start:"2026-01-31", end:"2026-05-31", periodNote:"(총 5회)", cond:"공휴일 포함 주 사용 불가", usedH:5, totalH:5, unit:"회",
    usage:[{date:"2026-04-12", note:"반복 회차 사용", amount:"1회"},{date:"2026-05-24", note:"반복 회차 사용", amount:"1회"}], history:[{date:"2026-06-01", change:"유효 기간 종료 처리", who:"시스템"}] },
  { no:16, date:"2026-04-02", dept:"신설부서", name:"최민서 사원A/사원", kind:"대상 휴가", type:"아호데이", grant:"반복", grantNote:"매주 · 일요일 기준 4시간", start:"2026-04-06", end:"2026-11-30", periodNote:"(총 34회)", cond:"제한 없음", usedH:34, totalH:34, unit:"회",
    usage:[{date:"2026-08-02", note:"반복 회차 사용", amount:"1회"},{date:"2026-08-09", note:"반차 사용", amount:"0.5회"}], history:[{date:"2026-04-02", change:"신규 등록", who:"김성현"},{date:"2026-08-09", change:"잔여 0회 도달", who:"시스템"}] }
];

var DEPTS = [
  { name:"운영팀/본사", members:["이광호 사원B/팀장B","고유리 사원B/부팀장B","서수연 사원D/직책크"] },
  { name:"실험부서",   members:["박지훈 사원C/파트장","정하늘 사원A/사원"] },
  { name:"신설부서",   members:["최민서 사원A/사원","9_test_3 사원_"] }
];

var state = {
  rows: SEED.map(function (r, i) { return Object.assign({}, r, { id: "r" + i, forcedDone: false }); }),
  fYear: "2026", fType: "전체", fGrant: "전체", fStatus: "전체", fQ: "",
  treeQ: "", openDepts: { "운영팀/본사": true, "실험부서": true, "신설부서": false },
  checked: {}, selected: {}, page: 1, sortKey: "no", sortDir: "desc",
  drawerId: null, drawerTab: "usage",
  modalOpen: false, editId: null, form: null, confirmIds: null
};

/* ---------- 상태 판정 ---------- */
function statusOf(r) {
  if (r.forcedDone) return "done";
  if (r.usedH >= r.totalH && d(r.start) <= TODAY) return "done";       /* 소진 = 종료 */
  if (d(r.start) > TODAY) return "scheduled";
  if (d(r.end) < TODAY) return "expired";                              /* 잔여 남고 기간 경과 = 만료 */
  return "inuse";
}
function isExpiring(r) {
  var dd = daysBetween(TODAY, d(r.end));
  return statusOf(r) === "inuse" && dd >= 0 && dd <= 30 && r.usedH < r.totalH;
}
var STATUS_META = {
  scheduled: { label: "예정",   cls: "status-scheduled" },
  inuse:     { label: "사용 중", cls: "status-inuse" },
  done:      { label: "종료",   cls: "status-done" },
  expired:   { label: "만료",   cls: "status-expired" }
};
function statusTip(r) {
  var st = statusOf(r);
  if (isExpiring(r)) return "유효 기간 종료까지 " + daysBetween(TODAY, d(r.end)) + "일 남았습니다. 미사용 잔여가 소멸됩니다.";
  if (st === "scheduled") return "유효 기간 시작 전입니다. " + r.start + "부터 사용할 수 있습니다.";
  if (st === "inuse") return "유효 기간 중이며 잔여를 사용할 수 있습니다.";
  if (st === "done") return "잔여를 모두 소진해 종료된 건입니다.";
  return "잔여가 남은 채 유효 기간(" + r.end + ")이 지나 만료된 건입니다.";
}

/* ---------- 조회 ---------- */
function checkedMembers() {
  return Object.keys(state.checked).filter(function (k) { return state.checked[k]; });
}
function filteredRows() {
  var picked = checkedMembers();
  var out = state.rows.filter(function (r) {
    if (state.fYear && r.start.slice(0, 4) !== state.fYear && r.end.slice(0, 4) !== state.fYear) return false;
    if (state.fType !== "전체" && r.kind !== state.fType) return false;
    if (state.fGrant !== "전체" && r.grant !== state.fGrant) return false;
    var st = statusOf(r);
    if (state.fStatus === "예정" && st !== "scheduled") return false;
    if (state.fStatus === "사용 중" && st !== "inuse") return false;
    if (state.fStatus === "종료" && st !== "done") return false;
    if (state.fStatus === "만료" && st !== "expired") return false;
    if (state.fStatus === "소멸 임박" && !isExpiring(r)) return false;
    if (state.fQ && (r.name + r.dept + r.type).toLowerCase().indexOf(state.fQ.toLowerCase()) < 0) return false;
    if (picked.length && picked.indexOf(r.dept + "·" + r.name) < 0) return false;
    return true;
  });
  var dir = state.sortDir === "asc" ? 1 : -1;
  out.sort(function (a, b) {
    return state.sortKey === "no" ? (a.no - b.no) * dir : (a.date < b.date ? -1 : 1) * dir;
  });
  return out;
}

/* ---------- 렌더 ---------- */
function render() {
  var all = filteredRows();
  var pageCount = Math.max(1, Math.ceil(all.length / PER_PAGE));
  if (state.page > pageCount) state.page = pageCount;
  var paged = all.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);

  renderStats();
  renderTree();
  renderList(all, paged, pageCount);
  renderDrawer();
  renderModal();
  renderConfirm();
}

function renderStats() {
  var rows = state.rows;
  var cards = [
    { cls: "", label: "전체 등록 건", value: rows.length, filter: "전체" },
    { cls: "scheduled", label: "예정", value: rows.filter(function (r) { return statusOf(r) === "scheduled"; }).length, filter: "예정" },
    { cls: "inuse", label: "사용 중", value: rows.filter(function (r) { return statusOf(r) === "inuse"; }).length, filter: "사용 중" },
    { cls: "expiring", label: "소멸 임박 (30일 내)", value: rows.filter(isExpiring).length, filter: "소멸 임박" }
  ];
  document.getElementById("statGrid").innerHTML = cards.map(function (c) {
    return '<div class="stat-card ' + c.cls + '" data-filter="' + c.filter + '">' +
             '<div class="label">' + c.label + '</div><div class="value">' + c.value + '</div></div>';
  }).join("");
}

function renderTree() {
  var picked = checkedMembers();
  document.getElementById("treeAll").innerHTML =
    '<span class="chk' + (picked.length ? " on" : "") + '"></span><span>전체선택</span>' +
    '<span class="count">' + picked.length + '명 선택</span>';

  document.getElementById("treeBody").innerHTML = DEPTS.map(function (dep) {
    var open = !!state.openDepts[dep.name];
    var members = dep.members.filter(function (m) {
      return !state.treeQ || (m + dep.name).toLowerCase().indexOf(state.treeQ.toLowerCase()) >= 0;
    });
    return '<div>' +
      '<div class="dept" data-dept="' + dep.name + '">' +
        '<span class="caret">' + (open ? "▾" : "▸") + '</span><span>' + dep.name + '</span>' +
        '<span class="num">(' + dep.members.length + ')</span></div>' +
      (open ? members.map(function (m) {
        var key = dep.name + "·" + m;
        return '<div class="member" data-member="' + key + '">' +
          '<span class="chk light' + (state.checked[key] ? " on" : "") + '"></span><span>' + m + '</span></div>';
      }).join("") : "") +
    '</div>';
  }).join("");
}

function renderList(all, paged, pageCount) {
  document.getElementById("resultLabel").textContent =
    "총 " + all.length + "건 · " + state.page + "/" + pageCount + " 페이지";

  var selIds = Object.keys(state.selected).filter(function (k) { return state.selected[k]; });
  document.getElementById("bulkArea").innerHTML = selIds.length
    ? '<div class="bulk-actions"><span class="count">' + selIds.length + '건 선택</span>' +
      '<button class="btn small outline positive" id="btnBulkEnd">선택 건 종료 처리</button>' +
      '<button class="btn small outline point3" id="btnBulkDelete">선택 건 삭제</button></div>'
    : "";

  var allOn = paged.length > 0 && paged.every(function (r) { return state.selected[r.id]; });
  document.getElementById("chkAll").className = "chk invert" + (allOn ? " on" : "");
  document.getElementById("arrowNo").textContent = state.sortKey === "no" ? (state.sortDir === "desc" ? "▾" : "▴") : "";
  document.getElementById("arrowDate").textContent = state.sortKey === "date" ? (state.sortDir === "desc" ? "▾" : "▴") : "";

  document.getElementById("tbody").innerHTML = paged.map(function (r) {
    var meta = STATUS_META[statusOf(r)];
    var hasCond = r.grant === "반복" && r.cond.indexOf("공휴일") >= 0;
    return '<tr>' +
      '<td><span class="chk' + (state.selected[r.id] ? " on" : "") + '" data-select="' + r.id + '"></span></td>' +
      '<td>' + r.no + '</td>' +
      '<td style="white-space:nowrap"><div class="sub">' + r.dept + '</div><div>' + r.name + '</div></td>' +
      '<td class="cell-left"><div class="type-cell"><span>' + r.type + '</span>' +
        (hasCond ? '<span class="has-tip"><span class="info-dot">!</span><span class="tip right">공휴일 포함 주 사용 불가</span></span>' : '') +
      '</div></td>' +
      '<td><div class="status-cell"><span class="tip top">' + statusTip(r) + '</span>' +
        '<span class="badge ' + meta.cls + '">' + meta.label + '</span>' +
        (isExpiring(r) ? '<span class="badge cyan">소멸 임박 D-' + daysBetween(TODAY, d(r.end)) + '</span>' : '') +
      '</div></td>' +
      '<td><div style="white-space:nowrap">' + r.start + ' ~ ' + r.end + '</div><div class="sub">' + r.periodNote + '</div></td>' +
      '<td style="white-space:nowrap"><div>사용 ' + r.usedH + r.unit + '</div>' +
        '<div class="remain">잔여 ' + Math.max(0, r.totalH - r.usedH) + r.unit + '</div></td>' +
      '<td style="white-space:nowrap"><div>' + r.grant + '</div><div class="sub">' + r.grantNote + '</div></td>' +
      '<td class="cell-date">' + r.date + '</td>' +
      '<td><div class="cell-actions">' +
        '<button class="btn small outline positive" data-history="' + r.id + '">변경</button>' +
        '<button class="btn small outline positive" data-usage="' + r.id + '">사용</button></div></td>' +
      '<td><div class="cell-actions">' +
        '<button class="btn small point" data-edit="' + r.id + '">수정</button>' +
        '<button class="btn small outline point3" data-delete="' + r.id + '">삭제</button></div></td>' +
    '</tr>';
  }).join("");

  document.getElementById("emptyState").innerHTML = all.length ? "" :
    '<div class="empty-state"><div class="icon">🗒</div><div>조건에 맞는 휴가 대상자가 없습니다. 필터를 조정해 주세요.</div></div>';

  var pages = [];
  for (var i = 1; i <= pageCount; i++) {
    pages.push('<div class="page' + (i === state.page ? " active" : "") + '" data-page="' + i + '">' + i + '</div>');
  }
  document.getElementById("pagination").innerHTML = pages.join("");
}

function renderDrawer() {
  var root = document.getElementById("drawerRoot");
  var r = state.rows.filter(function (x) { return x.id === state.drawerId; })[0];
  if (!r) { root.innerHTML = ""; return; }
  var list = state.drawerTab === "usage"
    ? r.usage.map(function (u) { return { left: u.date, mid: u.note, right: u.amount }; })
    : r.history.map(function (h) { return { left: h.date, mid: h.change, right: h.who }; });

  root.innerHTML =
    '<div class="drawer-overlay"><div class="scrim" data-close-drawer="1"></div><div class="drawer">' +
      '<div class="drawer-head"><div><h2>' + r.type + '</h2>' +
        '<div class="sub">' + r.dept + ' · ' + r.name + ' · ' + r.start + ' ~ ' + r.end + '</div></div>' +
        '<button class="modal-close" data-close-drawer="1">✕</button></div>' +
      '<div class="tab-group">' +
        '<button class="tab' + (state.drawerTab === "usage" ? " active" : "") + '" data-drawer-tab="usage">사용 내역</button>' +
        '<button class="tab' + (state.drawerTab === "history" ? " active" : "") + '" data-drawer-tab="history">변경 이력</button>' +
      '</div>' +
      '<div class="record-list">' +
        (list.length
          ? list.map(function (x) {
              return '<div class="item"><span>' + x.left + '</span><span class="mid">' + x.mid + '</span>' +
                     '<span class="right">' + x.right + '</span></div>';
            }).join("")
          : '<div class="empty-state">표시할 내역이 없습니다.</div>') +
      '</div>' +
    '</div></div>';
}

function emptyForm() {
  return { typeName: "휴가 형태 선택", detail: "", grant: "total", hours: "8",
           cycle: "매주", cycleDay: "일요일", start: "2026-09-01", end: "2026-12-31", cond: "none" };
}
/* 반복 주기 기준값 옵션 — 매주는 요일, 매월은 1~31일 + 말일 */
function cycleDayOptions(cycle) {
  if (cycle !== "매월") return ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
  var days = [];
  for (var i = 1; i <= 31; i++) days.push(i + "일");
  days.push("말일");
  return days;
}
function formPeriod(f) {
  var s = d(f.start), e = d(f.end);
  var diff = daysBetween(s, e);
  var months = Math.max(0, (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth()) +
                          (e.getDate() >= s.getDate() ? 1 : 0));
  return { diff: diff, weeks: Math.max(0, Math.floor(diff / 7) + 1), months: months };
}

function renderModal() {
  var root = document.getElementById("modalRoot");
  if (!state.modalOpen) { root.innerHTML = ""; return; }
  var f = state.form || emptyForm();
  var w = formPeriod(f);
  var targets = checkedMembers();
  var isRepeat = f.grant === "repeat";

  root.innerHTML =
  '<div class="modal-overlay"><div class="modal mid">' +
    '<div class="modal-header"><h2>' + (state.editId ? "휴가 대상자 수정" : "휴가 대상자 등록") + '</h2>' +
      '<button class="modal-close" data-close-modal="1">✕</button></div>' +
    '<div class="notice-banner">✓ ' + (state.editId
        ? "이미 사용된 건은 부여 총량을 사용량보다 작게 변경할 수 없습니다."
        : "조직도에서 선택한 구성원에게 동일 조건으로 일괄 부여됩니다.") + '</div>' +
    '<div class="form-grid" style="margin-top:22px">' +
      '<label class="key">대상자</label>' +
      '<div class="form-row">' + (targets.length
        ? targets.map(function (t) { return '<span class="chip">' + t.replace("·", " / ") + '</span>'; }).join("")
        : '<span class="helper warn">조직도에서 대상자를 먼저 선택해 주세요.</span>') + '</div>' +

      '<label class="key">휴가 형태</label>' +
      '<div class="form-row"><span class="chip">대상 휴가</span>' +
        '<select class="input-pill" id="formTypeName">' +
          ["휴가 형태 선택","아호데이","리프레시 휴가","보상 휴가","경조 휴가"].map(function (o) {
            return '<option' + (o === f.typeName ? " selected" : "") + '>' + o + '</option>';
          }).join("") + '</select>' +
        '<input class="input-pill" id="formDetail" maxlength="10" placeholder="최대 10글자 상세 입력" value="' + f.detail + '" style="width:220px" />' +
        '<span class="helper">' + f.detail.length + '/10</span></div>' +

      '<label class="key">부여 방식</label>' +
      '<div class="form-row">' +
        '<span class="opt" data-grant="total"><span class="rdo' + (isRepeat ? "" : " on") + '"></span>일반</span>' +
        '<span class="opt" data-grant="repeat" style="margin-left:14px"><span class="rdo' + (isRepeat ? " on" : "") + '"></span>반복</span>' +
        '<span class="helper" style="margin-left:10px">' + (isRepeat
          ? "설정한 주기마다 회차가 새로 부여되며, 미사용 회차는 다음 주기로 넘어가지 않습니다."
          : "부여된 총량에서 사용한 만큼 차감되며, 잔여가 0이 되면 사용할 수 없습니다.") + '</span></div>' +

      (isRepeat
        ? '<label class="key">반복 주기</label>' +
          '<div class="form-row">' +
            '<select class="input-pill" id="formCycle">' + ["매주","매월"].map(function (o) {
              return '<option' + (o === f.cycle ? " selected" : "") + '>' + o + '</option>'; }).join("") + '</select>' +
            '<select class="input-pill" id="formCycleDay">' + cycleDayOptions(f.cycle).map(function (o) {
              return '<option' + (o === f.cycleDay ? " selected" : "") + '>' + o + '</option>'; }).join("") + '</select>' +
            '<span>기준</span>' +
            '<input class="input-pill num" id="formHours" value="' + f.hours + '" />' +
            '<span>시간</span>' +
            '<span class="helper">' + (f.cycle === "매주" ? "총 " + w.weeks + "회차 예상" : "총 " + w.months + "회차 예상") + '</span></div>'
        : '<label class="key">부여 총량</label>' +
          '<div class="form-row">' +
            '<input class="input-pill num" id="formHours" value="' + f.hours + '" /><span>시간</span>' +
            '<span class="helper">= ' + (Math.round((Number(f.hours) || 0) / 8 * 10) / 10) + '일 (1일 8시간 기준)</span></div>') +

      '<label class="key">유효 기간</label>' +
      '<div class="form-row">' +
        '<input class="input-pill" type="date" id="formStart" value="' + f.start + '" /><span>~</span>' +
        '<input class="input-pill" type="date" id="formEnd" value="' + f.end + '" />' +
        (w.diff >= 0 ? '<span class="helper">(총 ' + w.weeks + '주 · ' + w.months + '개월)</span>'
                     : '<span class="helper warn">종료일이 시작일보다 빠릅니다.</span>') + '</div>' +

      (isRepeat
        ? '<label class="key">사용 조건</label>' +
          '<div class="form-row">' +
            '<span class="opt" data-cond="none"><span class="rdo' + (f.cond === "none" ? " on" : "") + '"></span>제한 없음</span>' +
            '<span class="opt" data-cond="holiday" style="margin-left:14px"><span class="rdo' + (f.cond === "holiday" ? " on" : "") + '"></span>공휴일 포함 주 사용 불가</span></div>'
        : "") +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn outline point" data-close-modal="1">취소</button>' +
      '<button class="btn point" id="btnSave">저장</button></div>' +
  '</div></div>';
}

function renderConfirm() {
  var root = document.getElementById("confirmRoot");
  if (!state.confirmIds) { root.innerHTML = ""; return; }
  root.innerHTML =
    '<div class="modal-overlay"><div class="modal small">' +
      '<div class="modal-header"><h2>삭제 확인</h2></div>' +
      '<div class="helper" style="line-height:1.7;margin-bottom:24px">선택한 ' + state.confirmIds.length +
        '건을 삭제합니다. 이미 사용된 내역이 있는 건은 삭제 후 복구할 수 없습니다.</div>' +
      '<div class="modal-footer"><button class="btn outline point" id="btnCancelDelete">취소</button>' +
        '<button class="btn point3" id="btnConfirmDelete">삭제</button></div>' +
    '</div></div>';
}

var toastTimer = null;
function showToast(text) {
  clearTimeout(toastTimer);
  document.getElementById("toastRoot").innerHTML = '<div class="toast">' + text + '</div>';
  toastTimer = setTimeout(function () { document.getElementById("toastRoot").innerHTML = ""; }, 2600);
}

/* ---------- 이벤트 ---------- */
document.getElementById("fYear").onchange   = function (e) { state.fYear = e.target.value; state.page = 1; render(); };
document.getElementById("fType").onchange   = function (e) { state.fType = e.target.value; state.page = 1; render(); };
document.getElementById("fGrant").onchange  = function (e) { state.fGrant = e.target.value; state.page = 1; render(); };
document.getElementById("fStatus").onchange = function (e) { state.fStatus = e.target.value; state.page = 1; render(); };
document.getElementById("treeQ").oninput    = function (e) { state.treeQ = e.target.value; render(); };
document.getElementById("btnSearch").onclick = function () { state.fQ = document.getElementById("fQ").value; state.page = 1; render(); };
document.getElementById("btnReset").onclick = function () {
  state.fYear = "2026"; state.fType = "전체"; state.fGrant = "전체"; state.fStatus = "전체";
  state.fQ = ""; state.checked = {}; state.selected = {}; state.page = 1;
  document.getElementById("fYear").value = "2026";
  document.getElementById("fType").value = "전체";
  document.getElementById("fGrant").value = "전체";
  document.getElementById("fStatus").value = "전체";
  document.getElementById("fQ").value = "";
  render();
};
document.getElementById("btnExcel").onclick = function () { showToast("조회된 " + filteredRows().length + "건을 엑셀로 내려받습니다."); };
document.getElementById("btnRegister").onclick = function () {
  state.modalOpen = true; state.editId = null; state.form = emptyForm(); render();
};
document.getElementById("chkAll").onclick = function () {
  var all = filteredRows();
  var paged = all.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);
  var on = !(paged.length > 0 && paged.every(function (r) { return state.selected[r.id]; }));
  paged.forEach(function (r) { state.selected[r.id] = on; });
  render();
};
Array.prototype.forEach.call(document.querySelectorAll("th.sortable"), function (th) {
  th.onclick = function () {
    var key = th.getAttribute("data-sort");
    state.sortDir = (state.sortKey === key && state.sortDir === "desc") ? "asc" : "desc";
    state.sortKey = key;
    render();
  };
});

document.addEventListener("click", function (e) {
  var hit = function (attr) { var el = e.target.closest("[" + attr + "]"); return el && el.getAttribute(attr); };

  var stat = hit("data-filter");
  if (stat) { state.fStatus = stat; document.getElementById("fStatus").value = stat; state.page = 1; return render(); }

  var dept = hit("data-dept");
  if (dept) { state.openDepts[dept] = !state.openDepts[dept]; return render(); }

  var member = hit("data-member");
  if (member) { state.checked[member] = !state.checked[member]; state.page = 1; return render(); }

  if (e.target.closest("#treeAll")) {
    if (checkedMembers().length) { state.checked = {}; }
    else { DEPTS.forEach(function (dep) { dep.members.forEach(function (m) { state.checked[dep.name + "·" + m] = true; }); }); }
    state.page = 1; return render();
  }

  var sel = hit("data-select");
  if (sel) { state.selected[sel] = !state.selected[sel]; return render(); }

  var page = hit("data-page");
  if (page) { state.page = Number(page); return render(); }

  var hid = hit("data-history");
  if (hid) { state.drawerId = hid; state.drawerTab = "history"; return render(); }

  var uid = hit("data-usage");
  if (uid) { state.drawerId = uid; state.drawerTab = "usage"; return render(); }

  var dtab = hit("data-drawer-tab");
  if (dtab) { state.drawerTab = dtab; return render(); }

  if (hit("data-close-drawer")) { state.drawerId = null; return render(); }

  var eid = hit("data-edit");
  if (eid) {
    var r = state.rows.filter(function (x) { return x.id === eid; })[0];
    var note = (r.grantNote || "").split(" · ");
    state.modalOpen = true; state.editId = eid;
    state.form = {
      typeName: r.type.split("_")[0], detail: r.type.split("_")[1] || "",
      grant: r.grant === "반복" ? "repeat" : "total", hours: String(r.totalH),
      cycle: note[0] === "매월" ? "매월" : "매주",
      cycleDay: note[1] ? note[1].split(" ")[0] : (note[0] === "매월" ? "1일" : "일요일"),
      start: r.start, end: r.end,
      cond: r.cond.indexOf("공휴일") >= 0 ? "holiday" : "none"
    };
    return render();
  }

  var did = hit("data-delete");
  if (did) { state.confirmIds = [did]; return render(); }

  if (hit("data-close-modal")) { state.modalOpen = false; state.editId = null; return render(); }

  var grant = hit("data-grant");
  if (grant) { state.form = Object.assign(state.form || emptyForm(), { grant: grant }); return render(); }

  var cond = hit("data-cond");
  if (cond) { state.form = Object.assign(state.form || emptyForm(), { cond: cond }); return render(); }

  if (e.target.id === "btnBulkEnd") {
    var ids = Object.keys(state.selected).filter(function (k) { return state.selected[k]; });
    state.rows = state.rows.map(function (r) { return ids.indexOf(r.id) >= 0 ? Object.assign({}, r, { forcedDone: true }) : r; });
    state.selected = {}; render(); return showToast(ids.length + "건을 종료 처리했습니다.");
  }
  if (e.target.id === "btnBulkDelete") {
    state.confirmIds = Object.keys(state.selected).filter(function (k) { return state.selected[k]; });
    return render();
  }
  if (e.target.id === "btnCancelDelete") { state.confirmIds = null; return render(); }
  if (e.target.id === "btnConfirmDelete") {
    var del = state.confirmIds || [];
    state.rows = state.rows.filter(function (r) { return del.indexOf(r.id) < 0; });
    state.confirmIds = null; state.selected = {}; state.drawerId = null;
    render(); return showToast(del.length + "건을 삭제했습니다.");
  }
  if (e.target.id === "btnSave") return saveForm();
});

document.addEventListener("input", function (e) {
  var id = e.target.id;
  if (["formDetail", "formHours"].indexOf(id) < 0) return;
  var f = state.form || emptyForm();
  if (id === "formDetail") f.detail = e.target.value.slice(0, 10);
  if (id === "formHours") f.hours = e.target.value.replace(/[^0-9.]/g, "");
  state.form = f;
  renderModal();
  var el = document.getElementById(id);
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
});

document.addEventListener("change", function (e) {
  var map = { formTypeName: "typeName", formCycle: "cycle", formCycleDay: "cycleDay", formStart: "start", formEnd: "end" };
  var key = map[e.target.id];
  if (!key) return;
  var patch = {};
  patch[key] = e.target.value;
  if (key === "cycle") patch.cycleDay = e.target.value === "매월" ? "1일" : "일요일";
  state.form = Object.assign(state.form || emptyForm(), patch);
  renderModal();
});

function saveForm() {
  var f = state.form || emptyForm();
  var w = formPeriod(f);
  if (w.diff < 0) return showToast("유효 기간을 확인해 주세요.");

  var isRepeat = f.grant === "repeat";
  var condText = isRepeat ? (f.cond === "holiday" ? "공휴일 포함 주 사용 불가" : "제한 없음") : "-";
  var grantNote = isRepeat ? f.cycle + " · " + f.cycleDay + " 기준 " + (f.hours || 0) + "시간" : "";
  var typeText = f.typeName === "휴가 형태 선택" ? "미지정 휴가" : f.typeName + (f.detail ? "_" + f.detail : "");

  if (state.editId) {
    state.rows = state.rows.map(function (r) {
      if (r.id !== state.editId) return r;
      return Object.assign({}, r, {
        type: typeText, grant: isRepeat ? "반복" : "일반", grantNote: grantNote,
        unit: isRepeat ? "회" : "시간", start: f.start, end: f.end,
        periodNote: "(총 " + w.weeks + "주)", cond: condText,
        totalH: Math.max(Number(f.hours) || 0, r.usedH),
        history: [{ date: "2026-08-23", change: "설정 수정", who: "김성현" }].concat(r.history)
      });
    });
    state.modalOpen = false; state.editId = null; render();
    return showToast("수정 내용을 저장했습니다.");
  }

  var targets = checkedMembers();
  if (!targets.length) return showToast("조직도에서 대상자를 먼저 선택해 주세요.");
  var maxNo = state.rows.reduce(function (m, r) { return Math.max(m, r.no); }, 0);
  var added = targets.map(function (k, i) {
    var parts = k.split("·");
    return {
      id: "n" + Date.now() + i, no: maxNo + i + 1, date: "2026-08-23",
      dept: parts[0], name: parts[1], kind: "대상 휴가",
      type: typeText, grant: isRepeat ? "반복" : "일반", grantNote: grantNote,
      start: f.start, end: f.end, periodNote: "(총 " + w.weeks + "주)", cond: condText,
      usedH: 0, totalH: Number(f.hours) || 0, unit: isRepeat ? "회" : "시간",
      forcedDone: false, usage: [], history: [{ date: "2026-08-23", change: "신규 등록", who: "김성현" }]
    };
  });
  state.rows = added.concat(state.rows);
  state.modalOpen = false; state.page = 1; state.sortKey = "no"; state.sortDir = "desc";
  render();
  showToast(added.length + "명에게 휴가를 부여했습니다.");
}

render();
</script>

</body>
</html>
